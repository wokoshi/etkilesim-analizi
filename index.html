<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Letterboxd Etkileşim Analizi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0B110D;
            --surface-card: #111A13;
            --surface-input: #0A130D;
            --border-subtle: #18261B;
            --border-highlight: rgba(255, 255, 255, 0.08);
            --brand-green: #00E054;
            --brand-green-hover: #00C247;
            --brand-dark-green: #1B5E32;
            --brand-danger: #FF453A;
            --text-primary: #FFFFFF;
            --text-secondary: #899B8E;
            --text-muted: #536457;
            --link-accent: #40BCF4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            padding: 40px 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1.main-title {
            font-size: 2.8rem;
            font-weight: 800;
            line-height: 1.08;
            letter-spacing: -1.2px;
            text-align: center;
            margin-bottom: 14px;
        }

        h1.main-title .white-text {
            color: var(--text-primary);
            display: block;
        }

        h1.main-title .green-text {
            color: var(--brand-green);
            display: block;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            text-align: center;
            margin-bottom: 26px;
            line-height: 1.5;
        }

        .card-container {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
            margin-bottom: 20px;
        }

        .action-row {
            display: flex;
            gap: 10px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-subtle);
            background: var(--surface-input);
            color: #FFFFFF;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #2F5938;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button.btn-check {
            background-color: var(--brand-green);
            color: #05140A;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 13px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }

        button.btn-check:hover { background-color: var(--brand-green-hover); }
        button.btn-check:disabled {
            background-color: #172B1D;
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .status-box {
            width: 100%;
            display: none;
            background: #0E1811;
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .status-box b { color: #FFFFFF; }

        .section-header {
            width: 100%;
            background: #111B13;
            border: 1px solid var(--border-subtle);
            border-left: 4px solid var(--brand-green);
            border-radius: 10px;
            padding: 12px 16px;
            margin-top: 24px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header.danger {
            border-left-color: var(--brand-danger);
        }

        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #FFFFFF;
            line-height: 1.4;
        }

        .count-pill {
            background: #080D0A;
            border: 1px solid var(--border-subtle);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            color: var(--brand-green);
            white-space: nowrap;
            margin-left: 8px;
        }
        .section-header.danger .count-pill {
            color: var(--brand-danger);
        }

        .results-grid {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }

        .user-card {
            background-color: var(--surface-card);
            border: 1px solid var(--border-subtle);
            padding: 10px 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }

        .user-card:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .user-card img {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #16241A;
            flex-shrink: 0;
            border: 1px solid var(--border-subtle);
        }

        .user-details {
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }

        .user-details .uname {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-details a {
            color: var(--brand-green);
            text-decoration: none;
            font-size: 11px;
        }
        .user-details a:hover { text-decoration: underline; }

        .date-badge {
            display: inline-block;
            font-size: 11px;
            padding: 3px 7px;
            border-radius: 4px;
            margin-top: 3px;
            width: fit-content;
            font-weight: 600;
        }
        .date-badge.green {
            background: rgba(0, 224, 84, 0.12);
            color: var(--brand-green);
            border: 1px solid rgba(0, 224, 84, 0.3);
        }
        .date-badge.red {
            background: rgba(255, 69, 58, 0.15);
            color: var(--brand-danger);
            border: 1px solid rgba(255, 69, 58, 0.35);
        }
        .date-badge.muted {
            background: #141C16;
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
        }

        footer.footer-sig {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 40px;
            padding-top: 18px;
            border-top: 1px solid var(--border-subtle);
            width: 100%;
        }
        footer.footer-sig a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
        }

        @media (max-width: 540px) {
            h1.main-title { font-size: 2.3rem; }
            .action-row { flex-direction: column; }
            button.btn-check { width: 100%; }
            .results-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="main-title">
        <span class="white-text">Letterboxd</span>
        <span class="green-text">Etkileşim Analizi</span>
    </h1>

    <p class="subtitle">Takip ettiklerinizin incelemelerinize etkileşim verip vermediğini öğrenin.</p>

    <div class="card-container">
        <div class="action-row">
            <div class="input-wrapper">
                <input type="text" id="username" placeholder="kullanıcı adı veya profil linki..." autocomplete="off" spellcheck="false" />
            </div>
            <button id="startBtn" class="btn-check" onclick="analiziBaslat()">Sorgula</button>
        </div>
    </div>

    <div id="statusBox" class="status-box"></div>
    <div id="outputContainer" style="width: 100%;"></div>

    <footer class="footer-sig">
        Created by <a href="https://letterboxd.com/wokoshi/" target="_blank">wokoshi</a>
    </footer>
</div>

<script>
const _0xsec = [
    "aHR0cHM6Ly9sZXR0ZXJib3hkLXByb3h5LjExN2VtaXIyMDAyLndvcmtlcnMuZGV2Lz91cmw9",
    "aHR0cHM6Ly9sZXR0ZXJib3hkLmNvbS8=",
    "aHR0cHM6Ly9zLmx0cmJ4ZC5jb20vc3RhdGljL2ltZy9hdmF0YXIyMjAucG5n"
];
const _t = (idx) => atob(_0xsec[idx]);

function cleanInput(val) {
    val = (val || "").trim();
    if (val.includes("letterboxd.com/")) {
        const p = val.split("letterboxd.com/")[1].split("/").filter(Boolean);
        return p[0] || val;
    }
    return val.replace(/[/@]/g, "");
}

async function fetchHtml(target) {
    try {
        const res = await fetch(_t(0) + encodeURIComponent(target));
        if (res.status === 404) return { s: 404, h: "" };
        if (!res.ok) return { s: res.status, h: "" };
        const text = await res.text();
        return { s: 200, h: text };
    } catch (e) {
        return { s: 500, h: "" };
    }
}

const MONTHS_MAP = {
    jan: { num: 0, tr: "Oca" }, feb: { num: 1, tr: "Şub" }, mar: { num: 2, tr: "Mar" },
    apr: { num: 3, tr: "Nis" }, may: { num: 4, tr: "May" }, jun: { num: 5, tr: "Haz" },
    jul: { num: 6, tr: "Tem" }, aug: { num: 7, tr: "Ağu" }, sep: { num: 8, tr: "Eyl" },
    oct: { num: 9, tr: "Eki" }, nov: { num: 10, tr: "Kas" }, dec: { num: 11, tr: "Ara" }
};

function parseLetterboxdDate(str) {
    if (!str || str === "İnceleme Yok" || str === "Bilinmiyor") return { timestamp: 0, trStr: str || "Bilinmiyor" };

    const raw = str.toLowerCase().trim();
    const now = new Date();

    if (raw.includes("just now") || raw.includes("moment") || raw.includes("min") || raw.includes("hour")) {
        return { timestamp: now.getTime(), trStr: "Bugün" };
    }
    if (raw.includes("yesterday")) {
        const y = new Date(now.getTime() - 86400000);
        return { timestamp: y.getTime(), trStr: "Dün" };
    }
    const daysMatch = raw.match(/(\d+)\s*days?/);
    if (daysMatch) {
        const d = new Date(now.getTime() - parseInt(daysMatch[1]) * 86400000);
        return { timestamp: d.getTime(), trStr: `${daysMatch[1]} gün önce` };
    }

    const cleaned = raw.replace(/(st|nd|rd|th|,)/g, "");
    const parts = cleaned.split(/\s+/);
    
    let day = 1, month = 0, year = now.getFullYear();
    let foundMonth = false;

    parts.forEach(p => {
        const sub = p.substring(0, 3);
        if (MONTHS_MAP[sub]) {
            month = MONTHS_MAP[sub].num;
            foundMonth = true;
        } else if (/^\d{4}$/.test(p)) {             year = parseInt(p);         } else if (/^\d{1,2}$/.test(p)) {
            day = parseInt(p);
        }
    });

    if (foundMonth) {
        const parsedDate = new Date(year, month, day);
        const trMonth = Object.values(MONTHS_MAP).find(m => m.num === month).tr;
        return { timestamp: parsedDate.getTime(), trStr: `${day} ${trMonth} ${year}` };
    }

    return { timestamp: 0, trStr: str };
}

function getCacheKey(username) {
    return `lb_cache_${username.toLowerCase()}`;
}

function getCacheData(username) {
    try {
        const raw = localStorage.getItem(getCacheKey(username));
        return raw ? JSON.parse(raw) : null;
    } catch(e) { return null; }
}

function saveCacheData(username, latestFilmSlug, htmlResult) {
    try {
        const now = Date.now();
        let cache = {
            lastSaved: now,
            latestFilmSlug: latestFilmSlug,
            htmlResult: htmlResult
        };
        localStorage.setItem(getCacheKey(username), JSON.stringify(cache));
    } catch(e) {}
}

function kisileriAyikla(doc, hedefObje) {
    const satirlar = doc.querySelectorAll(".person-summary");
    if (!satirlar || satirlar.length === 0) return 0;

    let eklenen = 0;
    satirlar.forEach(s => {
        const a = s.querySelector("a.name");
        if (a) {
            const uName = a.getAttribute("href").replace(/\//g, "").toLowerCase();
            const img = s.querySelector("img");
            const imgUrl = img && img.getAttribute("src") ? img.getAttribute("src") : _t(2);
            hedefObje[uName] = imgUrl;
            eklenen++;
        }
    });
    return eklenen;
}

async function getFollowingList(user, statusEl) {
    let following = {};
    const parser = new DOMParser();

    statusEl.innerHTML = `⏳ <b>Takip ettiğiniz hesaplar taranıyor:</b> 0 kişi bulundu...`;

    const firstUrl = `${_t(1)}${user}/following/`;
    let res = await fetchHtml(firstUrl);
    if (res.s !== 200 || !res.h) return following;

    const doc = parser.parseFromString(res.h, "text/html");
    const count = kisileriAyikla(doc, following);

    statusEl.innerHTML = `⏳ <b>Takip ettiğiniz hesaplar taranıyor:</b> ${Object.keys(following).length} kişi bulundu...`;

    if (count < 25) return following;

    let currentBatchStart = 2;
    let keepGoing = true;

    while (keepGoing) {
        const batchPages = [currentBatchStart, currentBatchStart + 1, currentBatchStart + 2];
        const promises = batchPages.map(p => fetchHtml(`${_t(1)}${user}/following/page/${p}/`));
        const results = await Promise.all(promises);

        for (let i = 0; i < results.length; i++) {
            const pageRes = results[i];
            if (pageRes.s !== 200 || !pageRes.h) {
                keepGoing = false;
                break;
            }

            const pDoc = parser.parseFromString(pageRes.h, "text/html");
            const added = kisileriAyikla(pDoc, following);

            statusEl.innerHTML = `⏳ <b>Takip ettiğiniz hesaplar taranıyor:</b> ${Object.keys(following).length} kişi bulundu...`;

            if (added < 25) {
                keepGoing = false;
                break;
            }
        }

        currentBatchStart += 3;
        await new Promise(r => setTimeout(r, 40));
    }

    return following;
}

function extractReviewsFromDoc(doc, cleanUser, existingReviews) {
    const allLinks = doc.querySelectorAll("a[href]");
    allLinks.forEach(a => {
        if (existingReviews.length >= 15) return;
        let href = a.getAttribute("href");
        if (!href) return;
        href = href.split("?")[0].split("#")[0].replace(/^\/|\/$/g, "");
        const parts = href.split("/");
        
        if (parts.length >= 3 && parts[0].toLowerCase() === cleanUser && parts[1] === "film") {
            if (!existingReviews.some(r => r.path === href)) {
                const slug = parts[2] || "film";
                let title = slug.replace(/-/g, " ").replace(/\b\w/g, l => l.toUpperCase());

                const container = a.closest("li, div.film-detail, div.film-detail-content") || a;
                const dateTag = container ? container.querySelector("time, span.date, span._nobr, p.attribution time") : null;
                const dateRaw = dateTag ? dateTag.textContent.trim() : "";

                existingReviews.push({ 
                    path: href, 
                    slug: slug,
                    title: title, 
                    dateParsed: parseLetterboxdDate(dateRaw) 
                });
            }
        }
    });
}

async function getTopReviews(user, statusEl) {
    let reviews = [];
    const parser = new DOMParser();
    const cleanUser = user.toLowerCase();

    statusEl.innerHTML = `⏳ <b>Son incelemeleriniz alınıyor...</b>`;
    let res = await fetchHtml(`${_t(1)}${cleanUser}/films/reviews/`);
    if (res.s === 200 && res.h) {
        const doc = parser.parseFromString(res.h, "text/html");
        doc.querySelectorAll("aside, .sidebar, #sidebar").forEach(s => s.remove());
        extractReviewsFromDoc(doc, cleanUser, reviews);
    }

    if (reviews.length < 15) {
        let resProf = await fetchHtml(`${_t(1)}${cleanUser}/`);
        if (resProf.s === 200 && resProf.h) {
            const docProf = parser.parseFromString(resProf.h, "text/html");
            extractReviewsFromDoc(docProf, cleanUser, reviews);
        }
    }

    if (reviews.length < 15) {
        let resP2 = await fetchHtml(`${_t(1)}${cleanUser}/films/reviews/page/2/`);
        if (resP2.s === 200 && resP2.h) {
            const docP2 = parser.parseFromString(resP2.h, "text/html");
            docP2.querySelectorAll("aside, .sidebar, #sidebar").forEach(s => s.remove());
            extractReviewsFromDoc(docP2, cleanUser, reviews);
        }
    }

    return reviews;
}

async function getReviewLikers(reviewPath) {
    let likers = new Set();
    let page = 1;
    const parser = new DOMParser();

    while (true) {
        let url = page === 1 ? `${_t(1)}${reviewPath}/likes/` : `${_t(1)}${reviewPath}/likes/page/${page}/`;
        let res = await fetchHtml(url);

        if (res.s !== 200 && page === 1 && reviewPath.split("/").length > 3) {
            const baseParts = reviewPath.split("/").slice(0, 3);
            url = `${_t(1)}${baseParts.join("/")}/likes/`;
            res = await fetchHtml(url);
        }

        if (res.s !== 200 || !res.h) break;

        const doc = parser.parseFromString(res.h, "text/html");
        doc.querySelectorAll("aside, .sidebar, #sidebar").forEach(s => s.remove());

        const cards = doc.querySelectorAll(".person-summary, a.avatar, table.person-table tr");
        if (!cards || cards.length === 0) break;

        let added = 0;
        cards.forEach(c => {
            const a = c.tagName === "A" ? c : (c.querySelector("a.name") || c.querySelector("a"));
            if (a && a.getAttribute("href")) {
                const uname = a.getAttribute("href").replace(/\//g, "").toLowerCase();
                if (uname && !["likes", "members"].includes(uname)) {
                    likers.add(uname);
                    added++;
                }
            }
        });

        if (added < 25) break;
        page++;
        await new Promise(r => setTimeout(r, 40));
    }
    return likers;
}

async function getUserLastDate(user) {
    const res = await fetchHtml(`${_t(1)}${user}/films/reviews/`);
    if (res.s === 200 && res.h) {
        const doc = new DOMParser().parseFromString(res.h, "text/html");
        const t = doc.querySelector("time, span.date, span._nobr, p.attribution time");
        if (t) return parseLetterboxdDate(t.textContent.trim());
    }
    const resProf = await fetchHtml(`${_t(1)}${user}/`);
    if (resProf.s === 200 && resProf.h) {
        const docP = new DOMParser().parseFromString(resProf.h, "text/html");
        const tP = docP.querySelector("section#recent-activity time, time");
        if (tP) return parseLetterboxdDate(tP.textContent.trim());
    }
    return { timestamp: 0, trStr: "İnceleme Yok" };
}

async function analiziBaslat() {
    const inputVal = document.getElementById("username").value;
    const username = cleanInput(inputVal);
    const btn = document.getElementById("startBtn");
    const statusBox = document.getElementById("statusBox");
    const out = document.getElementById("outputContainer");

    if (!username) {
        alert("Lütfen kullanıcı adı giriniz.");
        return;
    }

    btn.disabled = true;
    out.innerHTML = "";
    statusBox.style.display = "block";

    // 0 Kaçak Önbellek Kontrolü: 24 saat içinde yapıldıysa tek bir istek bile atmaz
    const cachedData = getCacheData(username);
    const now = Date.now();
    if (cachedData && cachedData.htmlResult && (now - cachedData.lastSaved) < 24 * 60 * 60 * 1000) {
        statusBox.innerHTML = `🎉 <b>Tüm analiz başarıyla tamamlandı!</b>`;
        out.innerHTML = cachedData.htmlResult;
        btn.disabled = false;
        return;
    }

    statusBox.innerHTML = `⏳ <b>Son incelemeleriniz alınıyor...</b>`;
    const checkReviews = await getTopReviews(username, statusBox);
    
    if (checkReviews.length === 0) {
        statusBox.innerHTML = `❌ <b>@${username}</b> hesabına ait herhangi bir film incelemesi tespit edilemedi.`;
        btn.disabled = false;
        return;
    }

    const currentLatestSlug = checkReviews[0].slug;

    const following = await getFollowingList(username, statusBox);
    const followingSet = new Set(Object.keys(following));

    if (followingSet.size === 0) {
        statusBox.innerHTML = `❌ Kullanıcı bulunamadı veya takip edilen kimse yok.`;
        btn.disabled = false;
        return;
    }

    statusBox.innerHTML = `⏳ <b>İncelemelerinizdeki beğeniler taranıyor...</b>`;
    const likesPromises = checkReviews.map(r => getReviewLikers(r.path));
    const allLikersResults = await Promise.all(likesPromises);

    let reviewLikes = {};
    checkReviews.forEach((r, idx) => {
        const likers = allLikersResults[idx];
        reviewLikes[idx + 1] = new Set([...likers].filter(x => followingSet.has(x)));
    });

    let assigned = new Set();
    let categoryMap = {};

    for (let i = 1; i <= checkReviews.length; i++) {
        let cur = reviewLikes[i];
        let fresh = new Set([...cur].filter(x => !assigned.has(x)));
        categoryMap[i] = fresh;
        cur.forEach(u => assigned.add(u));
    }

    const sifirCekenler = new Set([...followingSet].filter(x => !assigned.has(x)));

    let adaylar = new Set();
    for (let i = 6; i <= 15; i++) {
        if (categoryMap[i]) categoryMap[i].forEach(u => adaylar.add(u));
    }
    sifirCekenler.forEach(u => adaylar.add(u));

    const adaylarList = Array.from(adaylar);
    const totalAdaylar = adaylarList.length;

    let displayCount = 0;
    statusBox.innerHTML = `⏳ Kullanıcıların aktiflik durumları kontrol ediliyor: <b>0 / ${totalAdaylar}</b>`;
    
    const progressInterval = setInterval(() => {
        if (displayCount < totalAdaylar - 3) {
            displayCount += Math.floor(Math.random() * 6) + 4;
            if (displayCount > totalAdaylar - 2) displayCount = totalAdaylar - 2;
            statusBox.innerHTML = `⏳ Kullanıcıların aktiflik durumları kontrol ediliyor: <b>${displayCount} / ${totalAdaylar}</b>`;
        }
    }, 120);

    let userDates = {};
    const chunkSize = 100;
    for (let i = 0; i < totalAdaylar; i += chunkSize) {
        const chunk = adaylarList.slice(i, i + chunkSize);
        const dateResults = await Promise.all(chunk.map(u => getUserLastDate(u)));
        chunk.forEach((u, cIdx) => {
            userDates[u] = dateResults[cIdx];
        });
    }

    clearInterval(progressInterval);
    statusBox.innerHTML = `⏳ Kullanıcıların aktiflik durumları kontrol ediliyor: <b>${totalAdaylar} / ${totalAdaylar}</b>`;
    await new Promise(r => setTimeout(r, 200));

    statusBox.innerHTML = `🎉 <b>Tüm analiz başarıyla tamamlandı!</b>`;

    let finalHtml = "";

    // 6-15 Arası İncelemeler (0 kişi olanlar basılmaz)
    for (let i = 6; i <= 15; i++) {
        if (!categoryMap[i] || categoryMap[i].size === 0) continue;

        const rev = checkReviews[i - 1];
        const revBenchmarkTs = rev && rev.dateParsed ? rev.dateParsed.timestamp : 0;
        const filmBaslik = rev ? rev.title : `${i}. İnceleme`;

        const katList = Array.from(categoryMap[i]).sort((a, b) => {
            const tA = userDates[a] ? userDates[a].timestamp : 0;
            const tB = userDates[b] ? userDates[b].timestamp : 0;
            return tB - tA;
        });

        finalHtml += `
            <div class="section-header">
                <div class="section-title">
                    📌 En Son ${i}. İncelemeni Beğenenler: <b>${filmBaslik}</b>
                </div>
                <span class="count-pill">${katList.length} Kişi</span>
            </div>
            <div class="results-grid">
                ${katList.map(u => {
                    const uData = userDates[u] || { timestamp: 0, trStr: "Bilinmiyor" };
                    let badgeClass = "muted";
                    let badgePrefix = "📅";

                    if (uData.trStr === "İnceleme Yok" || uData.trStr === "Bilinmiyor" || uData.timestamp === 0) {
                        badgeClass = "muted";
                        badgePrefix = "⚠️";
                    } else if (revBenchmarkTs > 0 && uData.timestamp > revBenchmarkTs) {
                        badgeClass = "red";
                        badgePrefix = "🚨";
                    } else {
                        badgeClass = "green";
                        badgePrefix = "📅";
                    }

                    return `
                        <div class="user-card">
                            <img src="${following[u] || _t(2)}" />
                            <div class="user-details">
                                <span class="uname">${u}</span>
                                <a href="${_t(1)}${u}/" target="_blank">Profile Git ↗</a>
                                <span class="date-badge ${badgeClass}">${badgePrefix} Son İnc: ${uData.trStr}</span>
                            </div>
                        </div>
                    `;
                }).join("")}
            </div>
        `;
    }

    // Sıfır Çekenler (Son 15 İncelemede Sıfır)
    if (sifirCekenler.size > 0) {
        const latestRev = checkReviews[0];
        const latestRevTs = latestRev && latestRev.dateParsed ? latestRev.dateParsed.timestamp : 0;

        const sifirList = Array.from(sifirCekenler).sort((a, b) => {
            const tA = userDates[a] ? userDates[a].timestamp : 0;
            const tB = userDates[b] ? userDates[b].timestamp : 0;
            return tB - tA;
        });

        finalHtml += `
            <div class="section-header danger">
                <div class="section-title">
                    🚨 Son 15 İncelemende SIFIR Beğenisi Olanlar
                </div>
                <span class="count-pill">${sifirList.length} Kişi</span>
            </div>
            <div class="results-grid">
                ${sifirList.map(u => {
                    const uData = userDates[u] || { timestamp: 0, trStr: "Bilinmiyor" };
                    let badgeClass = "muted";
                    let badgePrefix = "🚨";

                    if (uData.trStr === "İnceleme Yok" || uData.trStr === "Bilinmiyor" || uData.timestamp === 0) {
                        badgeClass = "muted";
                        badgePrefix = "⚠️";
                    } else if (latestRevTs > 0 && uData.timestamp > latestRevTs) {
                        badgeClass = "red";
                        badgePrefix = "🚨";
                    } else {
                        badgeClass = "green";
                        badgePrefix = "📅";
                    }

                    return `
                        <div class="user-card">
                            <img src="${following[u] || _t(2)}" />
                            <div class="user-details">
                                <span class="uname">${u}</span>
                                <a href="${_t(1)}${u}/" target="_blank">Profile Git ↗</a>
                                <span class="date-badge ${badgeClass}">${badgePrefix} Son İnc: ${uData.trStr}</span>
                            </div>
                        </div>
                    `;
                }).join("")}
            </div>
        `;
    }

    out.innerHTML = finalHtml;
    saveCacheData(username, currentLatestSlug, finalHtml);
    btn.disabled = false;
}
</script>

</body>
</html>
